server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: portefeuille-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/portefeuille_initiatives?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:pfa_user}
    password: ${DB_PASSWORD:pfa2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # Le schéma et les données de référence proviennent de database/
      # (source unique versionnée) et sont embarqués dans le jar sous db/
      # par le bloc <resources> de pom.xml. « optional: » rend le démarrage
      # tolérant si les scripts sont absents (ex. exécution depuis l'IDE).
      mode: always
      encoding: UTF-8
      schema-locations: optional:classpath:db/schema.sql
      data-locations: optional:classpath:db/data.sql
  jpa:
    hibernate:
      # La structure est définie par database/schema.sql (fidèle au MPD).
      # Hibernate ne fait que valider sa cohérence avec le schéma.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  profiles:
    # Profil par défaut : autorise les valeurs de développement ci-dessous.
    # Tout autre profil (recette, production, conteneur) fait échouer le
    # démarrage si elles sont conservées (voir VerificationSecrets).
    default: dev

# Durée de validité du jeton JWT (en millisecondes) : 8 heures.
# Les valeurs sensibles sont surchargeables par variables d'environnement
# (voir .env.example) ; les valeurs par défaut permettent un lancement local.
app:
  jwt:
    secret: ${JWT_SECRET:PfaIT6ConsultingAgdalRabat2026CleSecreteTresLonguePourHS256===}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  security:
    # Durée de validité du cache de sessions (millisecondes). L'utilisateur et
    # ses permissions sont rechargeés à chaque requête ; ce cache évite une
    # requête SQL par appel. Toute modification d'un compte ou d'un rôle vide
    # immédiatement l'entrée concernée.
    cache-session-ms: ${SESSION_CACHE_MS:30000}
  admin:
    # Compte administrateur créé au premier démarrage si la base est vide
    # (DataInitializer) — plus aucun mot de passe codé en dur dans le code.
    email: ${ADMIN_EMAIL:admin@it6.ma}
    password: ${ADMIN_PASSWORD:Admin@123}
  cors:
    # Origines autorisées (motifs, séparés par des virgules).
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  ia:
    # Assistant IA « Demande à ton portefeuille » (Anthropic Claude).
    # Interrupteur global (kill switch) : false désactive l'assistant
    # même si une clé est présente — un simple redémarrage du conteneur
    # suffit, sans redéploiement de code.
    actif: ${IA_ACTIF:true}
    # Clé API Anthropic : jamais de valeur par défaut, jamais versionnée
    # (.env est ignoré par git, voir .env.example). Sans clé, la page
    # /assistant affiche « indisponible » et l'API répond 503 en clair.
    cle-api: ${ANTHROPIC_API_KEY:}
    # Modèle (défaut : claude-haiku-4-5 — rapide et économique) et
    # bornes d'appel : timeouts courts côté HTTP, réponse tronquée.
    modele: ${ANTHROPIC_MODELE:claude-haiku-4-5}
    max-tokens: ${IA_MAX_TOKENS:1024}
    timeout-ms: ${IA_TIMEOUT_MS:60000}
    url-api: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: portefeuille-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/portefeuille_initiatives?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:pfa_user}
    password: ${DB_PASSWORD:pfa2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Migration du schéma : Flyway remplace spring.sql.init et
  # database/schema.sql — source unique = database/migration (embarquée
  # dans le jar sous db/migration, cf. le bloc <resources> du pom).
  # - Une base VIERGE reçoit V1 (schéma) puis V2 (référentiels).
  # - Une base existante créée avant Flyway est simplement « baseline »
  #   (tag version 2) : ses tables et ses données ne sont jamais rejouées,
  #   seules les migrations ultérieures (V3+) s'y appliquent.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    baseline-description: "base existante anterieure a Flyway"
  jpa:
    hibernate:
      # La structure est définie par database/migration/V1__baseline.sql
      # (fidèle au MPD). Hibernate ne fait que valider sa cohérence.
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
    mail:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:25}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      properties:
        mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
        mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  profiles:
    # Profil par défaut : autorise les valeurs de développement ci-dessous.
    # Tout autre profil (recette, production, conteneur) fait échouer le
    # démarrage si elles sont conservées (voir VerificationSecrets).
    default: dev

# Jetons et cookies de session (valeurs sensibles surchargeables par
# variables d'environnement — voir .env.example).
app:
  jwt:
    secret: ${JWT_SECRET:PfaIT6ConsultingAgdalRabat2026CleSecreteTresLonguePourHS256===}
    # Access token COURT : 15 minutes, servi en cookie HttpOnly (pfa_access).
    # Au-delà, le client présente le cookie pfa_refresh (rotation, V4).
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    # Validité du jeton de rafraîchissement (rotation à chaque usage).
    refresh-jours: ${JWT_REFRESH_JOURS:7}
  cookie:
    # Secure = cookie réservé à HTTPS. True partout sauf autorisation
    # explicite pour un lancement local en HTTP (COOKIE_SECURE=false).
    secure: ${COOKIE_SECURE:true}
  verification:
    email:
      # Base URL du lien de verification envoye par e-mail (route front ou API).
      lien-base: ${EMAIL_VERIFICATION_BASE_URL:http://localhost/}
  invitation:
    duree-jours: 7
  security:
    # Durée de validité du cache de sessions (millisecondes). L'utilisateur et
    # ses permissions sont rechargeés à chaque requête ; ce cache évite une
    # requête SQL par appel. Toute modification d'un compte ou d'un rôle vide
    # immédiatement l'entrée concernée.
    cache-session-ms: ${SESSION_CACHE_MS:30000}
  admin:
    # Compte administrateur créé au premier démarrage si la base est vide
    # (DataInitializer). AUCUNE valeur par défaut ici : hors profil dev le
    # démarrage est refusé sans ADMIN_PASSWORD (VerificationSecrets).
    # La valeur de démonstration n'existe que dans application-dev.yml.
    email: ${ADMIN_EMAIL:admin@it6.ma}
    password: ${ADMIN_PASSWORD:}
  cors:
    # Origines autorisées (motifs, séparés par des virgules).
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  ia:
    # Assistant IA « Demande à ton portefeuille » (Anthropic Claude).
    # Interrupteur global (kill switch) : false désactive l'assistant
    # même si une clé est présente — un simple redémarrage du conteneur
    # suffit, sans redéploiement de code.
    actif: ${IA_ACTIF:true}
    # Format d'appel : « anthropic » (API /v1/messages, défaut) ou
    # « openai » (chat/completions compatible OpenAI : Ollama local,
    # LM Studio, Groq, Mistral, OpenRouter…). En mode openai, AUCUNE clé
    # n'est nécessaire pour un service local type Ollama.
    format: ${IA_FORMAT:anthropic}
    # Clé API : jamais de valeur par défaut, jamais versionnée (.env est
    # ignoré par git, voir .env.example). Exigée en mode anthropic ; en
    # mode openai elle est facultative (service local sans auth). Sans clé
    # en mode anthropic, la page /assistant affiche « indisponible » et
    # l'API répond 503 en clair.
    cle-api: ${ANTHROPIC_API_KEY:}
    # Modèle (défaut : claude-haiku-4-5 — rapide et économique ; en mode
    # openai, ex. qwen2.5:3b sous Ollama) et bornes d'appel : timeouts
    # courts côté HTTP, réponse tronquée.
    modele: ${IA_MODELE:${ANTHROPIC_MODELE:claude-haiku-4-5}}
    max-tokens: ${IA_MAX_TOKENS:1024}
    timeout-ms: ${IA_TIMEOUT_MS:60000}
    url-api: ${IA_BASE_URL:${ANTHROPIC_BASE_URL:https://api.anthropic.com}}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
# ==================================================================
# Déploiement complet du portefeuille d'initiatives : MySQL + API + Web.
#
#   1. cp .env.example .env      (puis renseigner DB_PASSWORD et JWT_SECRET)
#   2. docker compose up --build
#   3. http://localhost:  → application  (http://localhost:8080 → API)
#
# Les deux secrets SONT obligatoires : compose refuse de démarrer sans eux
# (syntaxe ${VAR:?message}), et le backend refuse lui-même de démarrer hors
# du profil dev si une valeur par défaut subsiste (VerificationSecrets).
# ==================================================================

services:

  # ---------------------------------------------------------------
  # Base de données MySQL 8.4
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: pfa-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-portefeuille_initiatives}
      MYSQL_USER: ${DB_USERNAME:-pfa_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant - copiez .env.example en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant - copiez .env.example en .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-donnees:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------
  # Backend Spring Boot (image multi-étapes, cf. backend/Dockerfile)
  # ---------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pfa-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      # L'application n'est PAS en profil dev dans le conteneur : les
      # secrets ci-dessous sont donc réellement vérifiés au démarrage.
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-portefeuille_initiatives}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-pfa_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant - copiez .env.example en .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant - copiez .env.example en .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      SESSION_CACHE_MS: ${SESSION_CACHE_MS:-30000}
      # Compte administrateur créé au premier démarrage (base vide) :
      # le mot de passe n'est plus codé en dur dans le code source.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@it6.ma}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      # Conteneurs : seule l'origine du front conteneurisé sert.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*}
      # Assistant IA (Anthropic / format ouvert) — OPTIONNEL : sans clé en
      # mode anthropic, la page /assistant affiche « indisponible » et
      # l'API répond 503 en clair (aucune panne). En mode openai (Ollama
      # local via host.docker.internal), AUCUNE clé nécessaire.
      # La clé ne transite que par .env (ignoré par git), jamais versionnée.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODELE: ${ANTHROPIC_MODELE:-claude-haiku-4-5}
      IA_ACTIF: ${IA_ACTIF:-true}
      IA_FORMAT: ${IA_FORMAT:-anthropic}
      IA_BASE_URL: ${IA_BASE_URL:-https://api.anthropic.com}
      IA_MODELE: ${IA_MODELE:-claude-haiku-4-5}
      IA_MAX_TOKENS: ${IA_MAX_TOKENS:-1024}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  # ---------------------------------------------------------------
  # Front React servi par nginx (proxy /api/ → backend, cf. nginx.conf)
  # ---------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pfa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONT_PORT:-80}:80"

volumes:
  mysql-donnees:

# ==================================================================
# nginx : sert le build React et transmet /api/ au backend.
#
# Le front et l'API sont alors sur une même origine : aucune requête
# CORS n'est émise par le navigateur, et baseURL: '/api' (api.js)
# fonctionne tel quel, sans variable d'environnement à build.
# ==================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HSTS : le navigateur ne réutilise ensuite que HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- CSP : seules les ressources de la même origine sont autorisées ------
    #  - script-src 'self'  : bundles Vite externes, aucun script inline
    #    (vérifiable dans la console du navigateur : zéro violation).
    #  - style-src 'unsafe-inline' : React pose des styles inline (barres de
    #    progression, graphiques) — autorisé pour les styles uniquement.
    #  - font-src 'self'    : polices embarquées dans /fonts (woff2 locaux).
    #  - img-src data:      : motifs SVG et avatars encodés en data URI.
    # ATTENTION nginx : un add_header dans une location annule ceux du
    # server — les en-têtes sont donc repris dans chaque location.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # --- API : proxy vers le service « backend » du réseau compose ---
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Transmis au backend : ProtectionConnexions limite les tentatives
        # de connexion par adresse réelle et non par celle du conteneur.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Application SPA : toutes les routes sont gérées par React ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets sont hashés par Vite : cache long possible.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header ici annule ceux du server : on les reprend.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }
}

name: CI

on:
  push:
    branches: [ feature/historique-complet ]
  pull_request:
    branches: [ feature/historique-complet ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valeurs de test uniquement (jamais de secret réel) :
      DB_URL: jdbc:mysql://127.0.0.1:3307/portefeuille_initiatives?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: pfa_user
      DB_PASSWORD: pfa2026
      JWT_SECRET: cle-de-test-pour-la-CI-uniquement-32-caracteres-min!!
      ADMIN_EMAIL: admin@it6.ma
      ADMIN_PASSWORD: CleDeTestAdminCI2026!
      COOKIE_SECURE: false
      SPRING_PROFILES_ACTIVE: dev
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_FROM: noreply@it6.ma
      MAIL_FROM_NAME: "Portefeuille IT6"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests (JUnit)
        run: mvn -q test
        working-directory: backend

      - name: Frontend install, tests (Vitest) and build
        run: |
          npm ci
          npm test
          npm run build
        working-directory: frontend
